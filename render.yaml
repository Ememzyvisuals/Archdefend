services:
  - type: web
    name: archdefend-api
    runtime: python
    region: oregon
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    # Alembic runs BEFORE uvicorn starts — handles free-tier restriction
    startCommand: >
      alembic upgrade head &&
      uvicorn main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --loop asyncio
      --timeout-keep-alive 30
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://archdefend-api.onrender.com/api/v1/auth/github/callback
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '["https://archdefend.vercel.app","http://localhost:3000"]'
      - key: ALLOWED_HOSTS
        value: '["*"]'
      - key: TEMP_CLONE_DIR
        value: /tmp/archdefend/repos
      - key: MAX_REPO_SIZE_MB
        value: "500"
      - key: CLONE_TIMEOUT_SECONDS
        value: "120"
      - key: FREE_TIER_CREDITS
        value: "20"
      - key: SMALL_REPO_CREDITS
        value: "5"
      - key: MEDIUM_REPO_CREDITS
        value: "15"
      - key: LARGE_REPO_CREDITS
        value: "40"
      - key: SECURITY_SCAN_CREDITS
        value: "15"
      - key: PPTX_EXPORT_CREDITS
        value: "5"
